name: Validate

# `pull_request` covers branches and `push` covers main and tags. Without the
# branch filter both fire for a branch that has a PR open, running every job
# twice for one change — six check runs for three jobs, and two of every
# notification.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # HACS and hassfest both check against a moving target — Home Assistant
    # releases monthly — so this runs on its own as well as on pushes.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Advisory, not blocking. `hacs/action` validates a repository for the HACS
    # *default store*, which this one has deliberately not adopted: it is
    # private and installed as a custom repository, which needs no topics,
    # description or brand assets. Two of its checks cannot pass at all here —
    # `brands` wants the food_calc domain registered in the public
    # home-assistant/brands repository, and the `hacs.json` and
    # `integration_manifest` failures are the action reading a private
    # repository's contents and getting nothing back (both files are valid;
    # hacs.json passes HACS's own HACS_MANIFEST_JSON_SCHEMA).
    #
    # Kept rather than deleted because what it reports is still worth seeing,
    # and because making this blocking again is one line if the repository is
    # ever made public or submitted to the store.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=custom_components/food_calc --cov-report=term-missing
